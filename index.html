<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS_TEMPLATE</title>

    <link rel="stylesheet" href="style.css" />
    <script defer src="main.js"></script>
  </head>

  <body>
    <div class="main">
      <h1>CS10 Grade Calculator</h1>
      <p>Your grade for Computing science 10 will be the <strong>average</strong> of your grades on five individual CTS modules.</p>
      <h3>Enter Grades</h3>
      <p>Client-Side Scripting 1: <input id="user-in1" type="number" /> <strong><span id="output1"></span></strong></p>
      <p>Structured Programming 1:  <input id="user-in2" type="number" /><strong><span id="output2"></span></strong></p>
      <p>Structured Programming 2: <input id="user-in3" type="number"/> <strong><span id="output3"></span></strong> </p></p>
      <p>Client-Side Scripting 2: <input id="user-in4" type="number"/> <strong> <span id="output4"></span> </strong></p>
      <p>Project A: <input id="user-in5" type="number"/><strong><span id="output5"></span></strong></p></p>

      <button id ="calculate" >Calculate CS10 Grade</button></p>

      <strong><p id="output"> CS10 Grade: -----% (--)</p></strong>
    </div>
  </body>
</html>
